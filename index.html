<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1e1f22" />
    <meta name="description" content="Cadence is a quiet, fast 60-second typing speed test. Measure your WPM and accuracy." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Cadence · 60-second typing test</title>
    <script>
      // Paint the saved theme's background before the app boots so a returning
      // visitor never sees a flash of the default theme. Safe if storage is blocked.
      try {
        var bg = localStorage.getItem('cadence.themeBg');
        if (bg && /^#[0-9a-fA-F]{3,8}$/.test(bg)) {
          document.documentElement.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cadence needs JavaScript to run the typing test.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
